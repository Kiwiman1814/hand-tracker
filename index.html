<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>Hand Tracker</title>
<style>
  :root { --bg:#0b0f14; --panel:rgba(11,15,20,.72); --text:#e8eef5; --dim:#8a97a6; --accent:#35d0a5; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }

  /* The camera picture and the drawing layer sit exactly on top of each other. */
  #stage { position:fixed; inset:0; }
  #video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* Front camera is shown mirrored so it feels like a mirror. */
  .mirrored { transform: scaleX(-1); }

  #topbar { position:fixed; top:0; left:0; right:0; display:flex; gap:8px; align-items:center;
            padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background:var(--panel);
            backdrop-filter: blur(8px); font-size:14px; }
  #status { flex:1; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button { font:inherit; color:var(--text); background:#1c2733; border:1px solid #2c3a4a;
           border-radius:10px; padding:8px 12px; }
  button:active { background:#2c3a4a; }

  #panel { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px;
           padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); background:var(--panel);
           backdrop-filter: blur(8px); }
  .hand { flex:1; min-width:0; }
  .hand h3 { margin:0 0 6px; font-size:13px; font-weight:600; color:var(--dim); }
  .row { display:grid; grid-template-columns: 52px 1fr 40px; align-items:center; gap:6px;
         font-size:12px; margin:3px 0; }
  .bar { height:8px; background:#1c2733; border-radius:4px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0%; background:var(--accent); }
  .pct { text-align:right; font-variant-numeric: tabular-nums; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:16px; align-items:center;
           justify-content:center; background:var(--bg); padding:24px; text-align:center; z-index:10; }
  #start h1 { margin:0; font-size:28px; }
  #start p { margin:0; color:var(--dim); max-width:320px; line-height:1.4; }
  #startBtn { font-size:18px; padding:14px 28px; background:var(--accent); color:#04261c; border:none; font-weight:700; }
  #error { color:#ff8a80; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="topbar">
  <span id="status">Idle</span>
  <button id="resetBtn">Reset blocks</button>
  <button id="flipBtn">Flip camera</button>
</div>

<div id="panel"></div>

<div id="start">
  <h1>Hand Tracker</h1>
  <p>Tracks up to two hands with your phone camera and shows how much each finger is curled (0 % = straight, 100 % = fist). Pinch thumb and index finger together on a block to pick it up and move it.</p>
  <button id="startBtn">Start camera</button>
  <p><small>This is just a test, not a current project.</small></p>
  <p id="error"></p>
</div>

<script type="module">
// =============================================================================
//  HAND TRACKER  -  runs fully in the phone browser, nothing is uploaded.
//
//  How it works, in 4 steps:
//    1. Open the camera            (startCamera)
//    2. Load Google's MediaPipe hand model  (loadModel)
//    3. Every frame: ask the model for 21 points per hand   (loop)
//    4. Turn the points into "finger curl %" and draw everything (fingerCurl, draw)
//
//  The 21 points ("landmarks") are numbered like this:
//      0 = wrist
//      1-4   thumb   (4 = tip)
//      5-8   index   (8 = tip)
//      9-12  middle  (12 = tip)
//      13-16 ring    (16 = tip)
//      17-20 pinky   (20 = tip)
// =============================================================================

import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ----------------------------- SETTINGS (try changing these!) ----------------
const MAX_HANDS   = 2;      // how many hands to look for (1 is faster)
const SMOOTHING   = 0.5;    // 0 = no smoothing (jittery), 0.9 = very smooth (laggy)
const CAM_WIDTH   = 640;    // lower = faster, higher = more accurate far away
const CAM_HEIGHT  = 480;

// Pinch = thumb tip touching index tip. We measure the gap between the two
// tips and divide by the size of the hand, so it works near and far.
// Two numbers (instead of one) stop the pinch flickering on/off at the limit.
const PINCH_ON    = 0.30;   // gap smaller than this  -> pinch starts
const PINCH_OFF   = 0.45;   // gap bigger than this   -> pinch lets go
const BLOCK_COLORS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#b197fc"];  // one block per colour

// Total bend (in degrees, summed over the finger's joints) that counts as
// 0 % and 100 % curl. If a finger never reaches 100 %, lower its "closed" value.
const CURL_RANGE = {
  Thumb:  { open: 15, closed: 100 },
  Index:  { open: 15, closed: 230 },
  Middle: { open: 15, closed: 230 },
  Ring:   { open: 15, closed: 230 },
  Pinky:  { open: 15, closed: 230 },
};

// Which landmark numbers make up each finger, from base to tip.
// The wrist (0) is added in front so we can also measure the knuckle bend.
const FINGERS = {
  Thumb:  [1, 2, 3, 4],
  Index:  [0, 5, 6, 7, 8],
  Middle: [0, 9, 10, 11, 12],
  Ring:   [0, 13, 14, 15, 16],
  Pinky:  [0, 17, 18, 19, 20],
};

// Lines to draw between landmarks (the "skeleton").
const BONES = [
  [0,1],[1,2],[2,3],[3,4],          // thumb
  [0,5],[5,6],[6,7],[7,8],          // index
  [9,10],[10,11],[11,12],           // middle
  [13,14],[14,15],[15,16],          // ring
  [0,17],[17,18],[18,19],[19,20],   // pinky
  [5,9],[9,13],[13,17],             // palm
];
const HAND_COLORS = ["#35d0a5", "#ffb454"];

// ----------------------------- PAGE ELEMENTS ---------------------------------
const video    = document.getElementById("video");
const canvas   = document.getElementById("overlay");
const ctx      = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const panel    = document.getElementById("panel");
const errorEl  = document.getElementById("error");

let handLandmarker = null;      // the AI model, once loaded
let facingMode     = "user";    // "user" = selfie camera, "environment" = back camera
let lastVideoTime  = -1;
let smoothed       = [{}, {}];  // remembered curl values, used for smoothing

// The newest result is also put here so other code (or the browser console)
// can read it. Later this is what you would send to the ESP32.
//   window.handData = [{ side:"Right", curl:{Thumb:12, Index:80, ...},
//                        pinch:{active:true, x:320, y:240} }, ...]
window.handData = [];

// ----------------------------- 1. CAMERA -------------------------------------
async function startCamera() {
  // Stop the old camera first (needed when flipping front/back).
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode, width: { ideal: CAM_WIDTH }, height: { ideal: CAM_HEIGHT } },
  });
  video.srcObject = stream;
  await video.play();

  // Mirror only the selfie camera.
  const mirror = facingMode === "user";
  video.classList.toggle("mirrored", mirror);
  canvas.classList.toggle("mirrored", mirror);
}

// ----------------------------- 2. MODEL --------------------------------------
async function loadModel() {
  const files = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");

  const options = (delegate) => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate,                       // "GPU" is fast, "CPU" works everywhere
    },
    runningMode: "VIDEO",
    numHands: MAX_HANDS,
  });

  try {
    handLandmarker = await HandLandmarker.createFromOptions(files, options("GPU"));
  } catch (e) {
    console.warn("GPU failed, using CPU instead:", e);
    handLandmarker = await HandLandmarker.createFromOptions(files, options("CPU"));
  }
}

// ----------------------------- 4a. MATH --------------------------------------
// Angle (degrees) between the direction a->b and the direction b->c.
// 0 = perfectly straight joint, 90 = bent at a right angle.
function bendAngle(a, b, c) {
  const v1 = { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z };
  const v2 = { x: c.x - b.x, y: c.y - b.y, z: c.z - b.z };
  const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
  const len = Math.hypot(v1.x, v1.y, v1.z) * Math.hypot(v2.x, v2.y, v2.z);
  if (len === 0) return 0;
  return Math.acos(Math.min(1, Math.max(-1, dot / len))) * 180 / Math.PI;
}

// Curl of one finger as 0-100 %. `points` are the 21 3D landmarks of one hand.
function fingerCurl(points, fingerName) {
  const ids = FINGERS[fingerName];
  let total = 0;
  // Add up the bend at every joint along the finger.
  for (let i = 0; i + 2 < ids.length; i++) {
    total += bendAngle(points[ids[i]], points[ids[i + 1]], points[ids[i + 2]]);
  }
  const { open, closed } = CURL_RANGE[fingerName];
  const pct = (total - open) / (closed - open) * 100;
  return Math.min(100, Math.max(0, pct));
}

// ----------------------------- 4c. PINCH + BLOCKS ----------------------------
let blocks      = [];             // each block: { x, y, size, color }  (x,y = top-left corner)
let isPinching  = [false, false]; // per hand: is it pinching right now?
let held        = [null, null];   // per hand: { block, dx, dy } while carrying a block

// The camera picture is cropped to fill the screen, so only part of it is
// visible. This returns that visible part, in camera-picture pixels.
function visibleArea() {
  const scale = Math.max(canvas.clientWidth / canvas.width, canvas.clientHeight / canvas.height);
  const w = canvas.clientWidth / scale, h = canvas.clientHeight / scale;
  return { x: (canvas.width - w) / 2, y: (canvas.height - h) / 2, w, h };
}

// Put the blocks back in a 2x2 grid in the middle of the screen.
function resetBlocks() {
  const area = visibleArea();
  const size = Math.min(area.w, area.h) * 0.2;
  const cx = area.x + area.w / 2, cy = area.y + area.h / 2;
  blocks = BLOCK_COLORS.map((color, i) => ({
    x: cx + (i % 2 ? 0.3 : -1.3) * size,
    y: cy + (i < 2 ? -1.3 : 0.3) * size,
    size, color,
  }));
  held = [null, null];
}

// Is hand number `i` pinching, and where? `points` are the flat picture landmarks.
function getPinch(points, i) {
  const w = canvas.width, h = canvas.height;
  const px = (n) => ({ x: points[n].x * w, y: points[n].y * h });   // landmark -> pixels
  const thumb = px(4), index = px(8), wrist = px(0), knuckle = px(9);

  const gap      = Math.hypot(thumb.x - index.x, thumb.y - index.y);
  const handSize = Math.hypot(wrist.x - knuckle.x, wrist.y - knuckle.y) || 1;
  const ratio    = gap / handSize;

  const before = isPinching[i];
  isPinching[i] = before ? ratio < PINCH_OFF : ratio < PINCH_ON;
  return {
    active:  isPinching[i],
    started: isPinching[i] && !before,          // true only on the first frame of a pinch
    x: (thumb.x + index.x) / 2,                 // the pinch point = between the two tips
    y: (thumb.y + index.y) / 2,
  };
}

// Pick up, carry and drop blocks.
function updateBlocks(hands) {
  const area = visibleArea();
  for (let i = 0; i < MAX_HANDS; i++) {
    const pinch = hands[i]?.pinch;
    if (!pinch || !pinch.active) { held[i] = null; continue; }   // let go

    // Pinch just started: is there a block under the fingers? (top one first)
    if (pinch.started) {
      for (let b = blocks.length - 1; b >= 0; b--) {
        const block = blocks[b], pad = block.size * 0.15;        // a little forgiving
        const inside = pinch.x > block.x - pad && pinch.x < block.x + block.size + pad &&
                       pinch.y > block.y - pad && pinch.y < block.y + block.size + pad;
        const taken = held.some(hd => hd && hd.block === block);
        if (inside && !taken) {
          held[i] = { block, dx: block.x - pinch.x, dy: block.y - pinch.y };
          blocks.splice(b, 1); blocks.push(block);               // draw it on top
          break;
        }
      }
    }

    // Carry: the block follows the pinch point, but stays on screen.
    if (held[i]) {
      const { block, dx, dy } = held[i];
      block.x = Math.min(area.x + area.w - block.size, Math.max(area.x, pinch.x + dx));
      block.y = Math.min(area.y + area.h - block.size, Math.max(area.y, pinch.y + dy));
    }
  }
}

// ----------------------------- 4b. DRAWING -----------------------------------
function draw(result, hands) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const w = canvas.width, h = canvas.height;

  // Blocks first, so the hand skeleton is drawn on top of them.
  for (const block of blocks) {
    const isHeld = held.some(hd => hd && hd.block === block);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = block.color;
    ctx.beginPath();
    ctx.roundRect(block.x, block.y, block.size, block.size, block.size * 0.15);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = isHeld ? 5 : 1.5;
    ctx.stroke();
  }

  // A ring at each pinch point: hollow = open, filled = pinching.
  for (const hand of hands) {
    ctx.beginPath();
    ctx.arc(hand.pinch.x, hand.pinch.y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();
    if (hand.pinch.active) { ctx.fillStyle = "#ffffff"; ctx.fill(); }
  }

  result.landmarks.forEach((points, handIndex) => {
    const color = HAND_COLORS[handIndex % HAND_COLORS.length];

    // Landmarks come as 0..1 fractions of the picture, so multiply by size.
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (const [a, b] of BONES) {
      ctx.moveTo(points[a].x * w, points[a].y * h);
      ctx.lineTo(points[b].x * w, points[b].y * h);
    }
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    for (const p of points) {
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

// Build the bars at the bottom once, then only update their numbers.
function buildPanel() {
  panel.innerHTML = "";
  for (let i = 0; i < MAX_HANDS; i++) {
    const div = document.createElement("div");
    div.className = "hand";
    div.innerHTML = `<h3 id="title${i}" style="color:${HAND_COLORS[i]}">Hand ${i + 1}: -</h3>` +
      Object.keys(FINGERS).map(name =>
        `<div class="row"><span>${name}</span>
           <div class="bar"><i id="bar${i}${name}" style="background:${HAND_COLORS[i]}"></i></div>
           <span class="pct" id="pct${i}${name}">-</span></div>`).join("");
    panel.appendChild(div);
  }
}

function updatePanel(hands) {
  for (let i = 0; i < MAX_HANDS; i++) {
    const hand = hands[i];
    document.getElementById("title" + i).textContent =
      `Hand ${i + 1}: ${hand ? hand.side : "-"}${hand?.pinch.active ? " · PINCH" : ""}`;
    for (const name of Object.keys(FINGERS)) {
      const value = hand ? Math.round(hand.curl[name]) : null;
      document.getElementById(`bar${i}${name}`).style.width = (value ?? 0) + "%";
      document.getElementById(`pct${i}${name}`).textContent = value === null ? "-" : value + "%";
    }
  }
}

// ----------------------------- 3. MAIN LOOP ----------------------------------
let frames = 0, fps = 0, fpsTimer = performance.now();

function loop() {
  requestAnimationFrame(loop);              // run again on the next screen refresh
  if (!handLandmarker || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;   // no new camera frame yet
  lastVideoTime = video.currentTime;

  // Keep the drawing layer the same size as the camera picture.
  if (canvas.width !== video.videoWidth) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    resetBlocks();
  }

  const result = handLandmarker.detectForVideo(video, performance.now());

  // "worldLandmarks" are real 3D positions in metres - better for angles
  // than the flat picture positions, because they don't change with camera angle.
  const sides = result.handedness ?? result.handednesses ?? [];
  const hands = result.worldLandmarks.map((points, i) => {
    // MediaPipe guesses left/right assuming a mirrored picture, and ours is not,
    // so its answer is the wrong way round. Swap it.
    const guess = sides[i]?.[0]?.categoryName;
    const side = guess === "Left" ? "Right" : guess === "Right" ? "Left" : "?";

    const curl = {};
    for (const name of Object.keys(FINGERS)) {
      const raw = fingerCurl(points, name);
      const old = smoothed[i][name] ?? raw;
      curl[name] = smoothed[i][name] = old * SMOOTHING + raw * (1 - SMOOTHING);
    }
    const pinch = getPinch(result.landmarks[i], i);
    return { side, curl, pinch };
  });
  // Forget the memory for hands that have left the picture.
  for (let i = hands.length; i < smoothed.length; i++) { smoothed[i] = {}; isPinching[i] = false; }

  updateBlocks(hands);
  draw(result, hands);

  window.handData = hands;
  updatePanel(hands);

  // Frames-per-second counter, updated twice a second.
  frames++;
  const now = performance.now();
  if (now - fpsTimer > 500) {
    fps = Math.round(frames * 1000 / (now - fpsTimer));
    frames = 0; fpsTimer = now;
    statusEl.textContent = `${fps} FPS · ${hands.length} hand${hands.length === 1 ? "" : "s"} · ${video.videoWidth}×${video.videoHeight}`;
  }
}

// ----------------------------- BUTTONS ---------------------------------------
document.getElementById("startBtn").onclick = async () => {
  try {
    errorEl.textContent = "";
    statusEl.textContent = "Starting camera…";
    document.getElementById("startBtn").textContent = "Loading…";
    await startCamera();
    document.getElementById("start").style.display = "none";
    statusEl.textContent = "Loading hand model (a few MB, first time only)…";
    await loadModel();
    // Stop the phone screen from dimming while tracking (ignored if unsupported).
    navigator.wakeLock?.request("screen").catch(() => {});
    loop();
  } catch (e) {
    console.error(e);
    document.getElementById("start").style.display = "flex";
    document.getElementById("startBtn").textContent = "Start camera";
    errorEl.textContent = e.name === "NotAllowedError"
      ? "Camera permission was denied. Allow the camera for this site and try again."
      : "Could not start: " + (e.message || e.name);
  }
};

document.getElementById("flipBtn").onclick = async () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  try { await startCamera(); } catch (e) { statusEl.textContent = "Flip failed: " + e.message; }
};

document.getElementById("resetBtn").onclick = resetBlocks;

buildPanel();
</script>
</body>
</html>
