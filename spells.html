<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>Hand Spells</title>
<style>
  :root { --bg:#0b0f14; --panel:rgba(11,15,20,.72); --text:#e8eef5; --dim:#8a97a6; --accent:#b197fc; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }

  /* Camera picture at the back, made darker so the spells glow. */
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.45) saturate(.7); }
  #video.mirrored { transform: scaleX(-1); }
  /* The effects layer covers the whole screen and lets touches through. */
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }

  #topbar { position:fixed; top:0; left:0; right:0; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center;
            padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background:var(--panel);
            backdrop-filter: blur(8px); font-size:14px; }
  #status { flex:1; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #score { font-weight:700; color:var(--accent); }
  button, .btn { font:inherit; color:var(--text); background:#1c2733; border:1px solid #2c3a4a;
           border-radius:10px; padding:8px 12px; text-decoration:none; }
  #hint { flex-basis:100%; font-size:13px; line-height:1.3; min-height:17px; }

  #panel { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
           padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px); background:var(--panel); backdrop-filter: blur(8px); }
  .spell { text-align:center; font-size:11px; color:var(--dim); border:1px solid #2c3a4a; border-radius:10px; padding:6px 2px; }
  .spell b { display:block; font-size:13px; color:var(--text); }
  .spell .icon { font-size:22px; line-height:1.2; }
  .spell.active { border-color:var(--glow); box-shadow:0 0 12px var(--glow); color:var(--text); }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:16px; align-items:center;
           justify-content:center; background:var(--bg); padding:24px; text-align:center; z-index:10; }
  #start h1 { margin:0; font-size:28px; }
  #start p { margin:0; color:var(--dim); max-width:320px; line-height:1.4; }
  #start a { color:var(--accent); }
  #startBtn { font-size:18px; padding:14px 28px; background:var(--accent); color:#1b103a; border:none; font-weight:700; }
  #error { color:#ff8a80; }
</style>
</head>
<body>

<video id="video" playsinline muted></video>
<canvas id="fx"></canvas>

<div id="topbar">
  <span id="status">Idle</span>
  <span id="score">Wisps: 0</span>
  <button id="flipBtn">Flip</button>
  <a class="btn" href="./">Blocks</a>
  <div id="hint"></div>
</div>

<div id="panel"></div>

<div id="start">
  <h1>Hand Spells</h1>
  <p>Cast spells with hand gestures and banish the floating wisps. Fist then open hand = fireball, point = lightning, two fingers = frost, fast open-hand swipe = gust.</p>
  <button id="startBtn">Start camera</button>
  <p><small>This is just a test, not a current project. <a href="./">Back to the block puzzles</a></small></p>
  <p id="error"></p>
</div>

<script type="module">
// =============================================================================
//  HAND SPELLS  -  a sister page to the block puzzles (index.html).
//
//  Same hand tracking, different toy:
//    1. Camera + hand model give 21 points per hand            (startCamera, loadModel)
//    2. Finger curl tells us which GESTURE the hand makes       (classify)
//    3. Gestures (plus how the hand moves) cast SPELLS          (updateHand)
//    4. Spells are particles, bolts and fireballs that hit WISPS (updateWorld, draw)
//
//  The camera/model code is the same as in index.html; the spell code starts
//  at "GESTURES".
// =============================================================================

import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ----------------------------- SETTINGS (try changing these!) ----------------
const MAX_HANDS   = 2;
const CAM_WIDTH   = 640;
const CAM_HEIGHT  = 480;

// Gestures: a finger counts as "straight" below STRAIGHT % curl and as
// "bent" above BENT % curl. If a gesture is hard to trigger, widen these.
const STRAIGHT    = 40;
const BENT        = 55;
const HOLD_FRAMES = 3;      // a gesture must be seen this many frames in a row (stops flicker)

const CHARGE_TIME = 1.2;    // seconds of fist to charge a full fireball
const BOLT_DAMAGE = 2.5;    // lightning damage per second
const GUST_SPEED  = 3.5;    // how fast an open hand must move (hand lengths per second) for a gust
const WISP_COUNT  = 4;      // how many targets float around
const WISP_HP     = 3;      // a full fireball does 3 damage
const MAX_PARTICLES = 700;

// The spell book shown at the bottom. `glow` is the colour (red, green, blue).
const SPELLS = {
  fist:  { name: "Fireball",  icon: "✊", how: "fist, then open",   glow: "255,140,50",
           hint: "Charging a fireball… open your hand to throw it." },
  point: { name: "Lightning", icon: "☝️", how: "point a finger",    glow: "120,170,255",
           hint: "Lightning! Aim with your index finger." },
  peace: { name: "Frost",     icon: "✌️", how: "two fingers",       glow: "140,230,255",
           hint: "Frost spray. Frozen wisps move slowly." },
  open:  { name: "Gust",      icon: "🖐️", how: "swipe open hand",   glow: "230,240,255",
           hint: "Open hand: swipe fast to blow wisps away." },
};

const CURL_RANGE = {
  Thumb:  { open: 15, closed: 100 },
  Index:  { open: 15, closed: 230 },
  Middle: { open: 15, closed: 230 },
  Ring:   { open: 15, closed: 230 },
  Pinky:  { open: 15, closed: 230 },
};
const FINGERS = {
  Thumb:  [1, 2, 3, 4],
  Index:  [0, 5, 6, 7, 8],
  Middle: [0, 9, 10, 11, 12],
  Ring:   [0, 13, 14, 15, 16],
  Pinky:  [0, 17, 18, 19, 20],
};
const BONES = [
  [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8], [9,10],[10,11],[11,12],
  [13,14],[14,15],[15,16], [0,17],[17,18],[18,19],[19,20], [5,9],[9,13],[13,17],
];

// ----------------------------- PAGE ELEMENTS ---------------------------------
const video    = document.getElementById("video");
const canvas   = document.getElementById("fx");
const ctx      = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const scoreEl  = document.getElementById("score");
const hintEl   = document.getElementById("hint");
const topbar   = document.getElementById("topbar");
const panel    = document.getElementById("panel");
const errorEl  = document.getElementById("error");

let handLandmarker = null;
let facingMode     = "user";
let lastVideoTime  = -1;

// ----------------------------- CAMERA + MODEL (same as index.html) -----------
async function startCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode, width: { ideal: CAM_WIDTH }, height: { ideal: CAM_HEIGHT } },
  });
  video.srcObject = stream;
  await video.play();
  video.classList.toggle("mirrored", facingMode === "user");
}

// Start on the fast GPU, keep a CPU copy ready in case the GPU sees nothing
// (that happens on some phones). Add ?cpu to the address to force the CPU.
let engine = "GPU", cpuBackup = null, lastCheck = 0, misses = 0;

async function loadModel() {
  const files = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const create = (delegate) => HandLandmarker.createFromOptions(files, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate,
    },
    runningMode: "VIDEO",
    numHands: MAX_HANDS,
  });
  handLandmarker = null;
  if (!location.search.includes("cpu")) {
    try { handLandmarker = await create("GPU"); engine = "GPU"; }
    catch (e) { console.warn("GPU failed, using CPU instead:", e); }
  }
  if (!handLandmarker) { handLandmarker = await create("CPU"); engine = "CPU"; }
  if (engine === "GPU") create("CPU").then(m => { cpuBackup = m; }).catch(() => {});
}

function useCpu(why) {
  console.warn("Switching to CPU:", why);
  handLandmarker = cpuBackup; cpuBackup = null; engine = "CPU";
}

function checkGpu(result, now) {
  if (engine !== "GPU" || !cpuBackup) return false;
  if (result.landmarks.length > 0) { misses = 0; return false; }
  if (now - lastCheck < 1000) return false;
  lastCheck = now;
  misses = cpuBackup.detectForVideo(video, now).landmarks.length > 0 ? misses + 1 : 0;
  if (misses < 2) return false;
  useCpu("GPU found no hand but CPU did");
  return true;
}

function showError(message) {
  statusEl.textContent = "Error: " + message;
  statusEl.style.color = "#ff8a80";
}
window.addEventListener("error", (e) => showError(e.message));
window.addEventListener("unhandledrejection", (e) => showError(e.reason?.message ?? String(e.reason)));

// ----------------------------- FINGER CURL (same as index.html) --------------
function bendAngle(a, b, c) {
  const v1 = { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z };
  const v2 = { x: c.x - b.x, y: c.y - b.y, z: c.z - b.z };
  const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
  const len = Math.hypot(v1.x, v1.y, v1.z) * Math.hypot(v2.x, v2.y, v2.z);
  if (len === 0) return 0;
  return Math.acos(Math.min(1, Math.max(-1, dot / len))) * 180 / Math.PI;
}

function fingerCurl(points, fingerName) {
  const ids = FINGERS[fingerName];
  let total = 0;
  for (let i = 0; i + 2 < ids.length; i++) {
    total += bendAngle(points[ids[i]], points[ids[i + 1]], points[ids[i + 2]]);
  }
  const { open, closed } = CURL_RANGE[fingerName];
  return Math.min(100, Math.max(0, (total - open) / (closed - open) * 100));
}

// ----------------------------- GESTURES --------------------------------------
// Turn the curl of the four fingers into a gesture name. The thumb is ignored,
// because people hold it in all sorts of ways.
function classify(curl) {
  const straight = (name) => curl[name] < STRAIGHT;
  const bent     = (name) => curl[name] > BENT;
  if (bent("Index") && bent("Middle") && bent("Ring") && bent("Pinky"))             return "fist";
  if (straight("Index") && bent("Middle") && bent("Ring") && bent("Pinky"))         return "point";
  if (straight("Index") && straight("Middle") && bent("Ring") && bent("Pinky"))     return "peace";
  if (straight("Index") && straight("Middle") && straight("Ring") && straight("Pinky")) return "open";
  return "none";
}

// ----------------------------- THE WORLD -------------------------------------
// Everything below is measured in screen pixels (not camera pixels), so the
// effects stay sharp.
let W = 1, H = 1;                       // screen size
let area = { x: 0, y: 0, w: 1, h: 1 };  // free space between the top and bottom bars
let unit = 300;                         // short side of that space; sizes and speeds are based on it

let particles = [];     // glowing dots:   { x, y, vx, vy, life, maxLife, size, color, frost }
let fireballs = [];     // flying fire:    { x, y, vx, vy, r }
let gusts     = [];     // wind waves:     { x, y, dx, dy, age, size, hit }
let rings     = [];     // explosion rings:{ x, y, r, max, age }
let bolts     = [];     // lightning right now: { a, b }
let wisps     = [];     // targets:        { x, y, vx, vy, r, hp, frozen, dead, respawn }
let score     = 0;

// What we remember about each hand between frames.
const newHand = () => ({ gesture: "none", candidate: "none", frames: 0, charge: 0,
                         pts: null, pos: null, vel: { x: 0, y: 0 }, size: 60, gustWait: 0 });
const hands = [newHand(), newHand()];

const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function unitVector(x, y) { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; }

// Fit the effects layer to the screen (also called when the phone is turned).
function resize() {
  const sharp = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * sharp; canvas.height = H * sharp;
  ctx.setTransform(sharp, 0, 0, sharp, 0, 0);          // so we can draw in normal screen pixels
  const top = topbar.getBoundingClientRect().bottom, bottom = panel.getBoundingClientRect().top;
  area = { x: 0, y: top, w: W, h: Math.max(80, bottom - top) };
  unit = Math.min(area.w, area.h);
  wisps = [];
  for (let i = 0; i < WISP_COUNT; i++) wisps.push(spawnWisp({}));
}

// A camera landmark (0..1 of the camera picture) -> screen pixels. The picture
// is scaled up to cover the screen and mirrored for the selfie camera.
function toScreen(p) {
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const scale = Math.max(W / vw, H / vh);
  let x = (W - vw * scale) / 2 + p.x * vw * scale;
  const y = (H - vh * scale) / 2 + p.y * vh * scale;
  if (facingMode === "user") x = W - x;
  return { x, y };
}

function addParticle(p) {
  if (particles.length < MAX_PARTICLES) particles.push({ maxLife: p.life, ...p });
}

function spawnWisp(w) {
  const r = unit * 0.06, angle = rand(0, Math.PI * 2), speed = unit * 0.12;
  return Object.assign(w, {
    x: rand(area.x + r * 2, area.x + area.w - r * 2), y: rand(area.y + r * 2, area.y + area.h - r * 2),
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r, hp: WISP_HP, frozen: 0, dead: false, respawn: 0 });
}

function hurtWisp(w, damage) {
  if (w.dead) return;
  w.hp -= damage;
  if (w.hp > 0) return;
  w.dead = true; w.respawn = 1.2;
  score++;
  scoreEl.textContent = "Wisps: " + score;
  for (let i = 0; i < 30; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.1, 0.9) * unit;
    addParticle({ x: w.x, y: w.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.8), size: rand(3, 8), color: "190,150,255" });
  }
}

// ----------------------------- SPELLS ----------------------------------------
// Called once per frame for every hand that is visible.
//   pts = the 21 landmarks in screen pixels, raw = the gesture seen this frame.
function updateHand(h, pts, raw, dt) {
  // --- where is the hand and how fast does it move? ---
  h.pts  = pts;
  h.size = dist(pts[0], pts[9]) || 60;                 // wrist to middle knuckle = "one hand length"
  const pos = pts[9];
  if (h.pos) {
    h.vel.x = h.vel.x * 0.5 + (pos.x - h.pos.x) / dt * 0.5;      // smoothed speed in pixels per second
    h.vel.y = h.vel.y * 0.5 + (pos.y - h.pos.y) / dt * 0.5;
  }
  h.pos = pos;
  h.gustWait -= dt;

  // --- which gesture? Only accept one that stays for a few frames. ---
  if (raw === h.candidate) h.frames++; else { h.candidate = raw; h.frames = 1; }
  if (h.frames >= HOLD_FRAMES) h.gesture = raw;

  // --- FIREBALL: a fist charges it, opening the hand throws it ---
  if (h.gesture === "fist") {
    h.charge = Math.min(1, h.charge + dt / CHARGE_TIME);
    for (let i = 0; i < 2; i++) {                      // little flames rising from the fist
      addParticle({ x: pos.x + rand(-1, 1) * h.size * 0.3, y: pos.y + rand(-1, 1) * h.size * 0.3,
                    vx: rand(-20, 20), vy: -rand(40, 120), life: rand(0.3, 0.6),
                    size: h.size * (0.08 + 0.12 * h.charge), color: Math.random() < 0.5 ? "255,120,30" : "255,200,60" });
    }
  } else if (h.charge > 0) {
    if (h.gesture === "open" && h.charge > 0.2) { throwFireball(h); h.charge = 0; }
    else h.charge = Math.max(0, h.charge - dt * 2);    // fizzles out if you do something else
  }

  if (h.gesture === "point") castLightning(h, dt);
  if (h.gesture === "peace") castFrost(h);
  if (h.gesture === "open" && h.gustWait <= 0 && Math.hypot(h.vel.x, h.vel.y) > GUST_SPEED * h.size) castGust(h);
}

function throwFireball(h) {
  // Thrown the way the hand is moving; if the hand is still, the way it points.
  const moving = Math.hypot(h.vel.x, h.vel.y) > 1.5 * h.size;
  const dir = moving ? unitVector(h.vel.x, h.vel.y) : unitVector(h.pts[9].x - h.pts[0].x, h.pts[9].y - h.pts[0].y);
  const speed = unit * 1.6;
  fireballs.push({ x: h.pos.x, y: h.pos.y, vx: dir.x * speed, vy: dir.y * speed, r: h.size * (0.2 + 0.3 * h.charge) });
  h.gustWait = 0.6;                                    // so the throw doesn't also count as a gust
}

function explode(x, y, r) {
  rings.push({ x, y, r, max: r * 3.5, age: 0 });
  for (let i = 0; i < 45; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.2, 1.3) * unit;
    addParticle({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.7), size: rand(4, 12),
                  color: Math.random() < 0.5 ? "255,120,30" : "255,210,80" });
  }
  for (const w of wisps) if (!w.dead && dist(w, { x, y }) < r * 3.5 + w.r) hurtWisp(w, WISP_HP);
}

function castLightning(h, dt) {
  const from = h.pts[8];                                               // index fingertip
  const dir  = unitVector(h.pts[8].x - h.pts[5].x, h.pts[8].y - h.pts[5].y);   // knuckle -> tip

  // Which wisp does the line from the finger hit first?
  let target = null, best = Infinity;
  for (const w of wisps) {
    if (w.dead) continue;
    const along  = (w.x - from.x) * dir.x + (w.y - from.y) * dir.y;                // distance along the line
    const beside = Math.abs((w.x - from.x) * dir.y - (w.y - from.y) * dir.x);      // distance off to the side
    if (along > 0 && beside < w.r + 14 && along < best) { best = along; target = w; }
  }

  let to;
  if (target) {
    to = { x: target.x, y: target.y };
    hurtWisp(target, BOLT_DAMAGE * dt);
  } else {
    // No hit: the bolt runs to the edge of the screen.
    const tx = dir.x > 0 ? (W - from.x) / dir.x : dir.x < 0 ? -from.x / dir.x : Infinity;
    const ty = dir.y > 0 ? (H - from.y) / dir.y : dir.y < 0 ? -from.y / dir.y : Infinity;
    const t = Math.min(tx, ty);
    to = { x: from.x + dir.x * t, y: from.y + dir.y * t };
  }
  bolts.push({ a: from, b: to });
  addParticle({ x: to.x, y: to.y, vx: rand(-200, 200), vy: rand(-200, 200), life: 0.2, size: rand(2, 5), color: "170,200,255" });
}

function castFrost(h) {
  const from = { x: (h.pts[8].x + h.pts[12].x) / 2, y: (h.pts[8].y + h.pts[12].y) / 2 };   // between the two fingertips
  const dir  = unitVector(h.pts[8].x - h.pts[5].x + h.pts[12].x - h.pts[9].x,
                          h.pts[8].y - h.pts[5].y + h.pts[12].y - h.pts[9].y);
  const aim = Math.atan2(dir.y, dir.x);
  for (let i = 0; i < 3; i++) {
    const a = aim + rand(-0.28, 0.28), s = unit * rand(0.9, 1.5);
    addParticle({ x: from.x, y: from.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.5),
                  size: rand(3, 7), color: Math.random() < 0.5 ? "150,230,255" : "235,250,255", frost: true });
  }
}

function castGust(h) {
  const dir = unitVector(h.vel.x, h.vel.y);
  gusts.push({ x: h.pos.x, y: h.pos.y, dx: dir.x, dy: dir.y, age: 0, size: h.size * 1.6, hit: new Set() });
  h.gustWait = 0.6;
}

// Move everything that is not a hand.
function updateWorld(dt) {
  for (const f of fireballs) {
    f.x += f.vx * dt; f.y += f.vy * dt;
    addParticle({ x: f.x + rand(-1, 1) * f.r * 0.5, y: f.y + rand(-1, 1) * f.r * 0.5, vx: rand(-30, 30), vy: rand(-30, 30),
                  life: rand(0.2, 0.45), size: f.r * rand(0.4, 0.8), color: Math.random() < 0.5 ? "255,120,30" : "255,200,60" });
    const hitWisp = wisps.some(w => !w.dead && dist(w, f) < w.r + f.r);
    const outside = f.x < 0 || f.x > W || f.y < area.y || f.y > area.y + area.h;
    if (hitWisp || outside) { explode(Math.min(W, Math.max(0, f.x)), Math.min(area.y + area.h, Math.max(area.y, f.y)), f.r); f.done = true; }
  }
  fireballs = fireballs.filter(f => !f.done);

  for (const g of gusts) {
    g.age += dt;
    g.x += g.dx * unit * 2.2 * dt; g.y += g.dy * unit * 2.2 * dt;
    for (const w of wisps) {
      if (w.dead || g.hit.has(w) || dist(w, g) > g.size + w.r) continue;
      g.hit.add(w);                                    // each gust pushes a wisp only once
      w.vx += g.dx * unit * 1.8; w.vy += g.dy * unit * 1.8;
    }
  }
  gusts = gusts.filter(g => g.age < 0.55);

  for (const r of rings) r.age += dt;
  rings = rings.filter(r => r.age < 0.35);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (!p.frost) continue;
    for (const w of wisps) {                            // frost freezes and slightly hurts
      if (!w.dead && dist(w, p) < w.r + p.size) { w.frozen = 3; hurtWisp(w, 0.012); p.life = 0; break; }
    }
  }
  particles = particles.filter(p => p.life > 0);

  const cruise = unit * 0.12;                           // the speed wisps settle back to
  for (const w of wisps) {
    if (w.dead) { w.respawn -= dt; if (w.respawn <= 0) spawnWisp(w); continue; }
    w.frozen = Math.max(0, w.frozen - dt);
    const slow = w.frozen > 0 ? 0.15 : 1;
    w.x += w.vx * dt * slow; w.y += w.vy * dt * slow;
    const speed = Math.hypot(w.vx, w.vy);
    if (speed > cruise) { const keep = Math.max(cruise / speed, 1 - 2 * dt); w.vx *= keep; w.vy *= keep; }
    if (w.x < area.x + w.r)          { w.x = area.x + w.r;          w.vx =  Math.abs(w.vx); }
    if (w.x > area.x + area.w - w.r) { w.x = area.x + area.w - w.r; w.vx = -Math.abs(w.vx); }
    if (w.y < area.y + w.r)          { w.y = area.y + w.r;          w.vy =  Math.abs(w.vy); }
    if (w.y > area.y + area.h - w.r) { w.y = area.y + area.h - w.r; w.vy = -Math.abs(w.vy); }
  }
}

// ----------------------------- DRAWING ---------------------------------------
function glow(x, y, radius, color, strength = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, `rgba(${color},${strength})`);
  g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
}

// A jagged line from a to b, drawn again with new zigzags every frame.
function drawBolt(a, b, width) {
  const length = dist(a, b), steps = Math.max(4, Math.floor(length / 18));
  const nx = -(b.y - a.y) / (length || 1), ny = (b.x - a.x) / (length || 1);   // sideways direction
  const path = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, wobble = i === 0 || i === steps ? 0 : rand(-1, 1) * 11;
    path.push({ x: a.x + (b.x - a.x) * t + nx * wobble, y: a.y + (b.y - a.y) * t + ny * wobble });
  }
  const stroke = (style, w) => {
    ctx.strokeStyle = style; ctx.lineWidth = w;
    ctx.beginPath(); path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  };
  stroke("rgba(110,160,255,.45)", width * 4);          // wide blue glow
  stroke("#ffffff", width);                            // thin white core
  if (width > 1 && Math.random() < 0.5) {              // sometimes a small side branch
    const start = path[Math.floor(rand(1, steps))];
    drawBolt(start, { x: start.x + rand(-60, 60), y: start.y + rand(-60, 60) }, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Wisps
  for (const w of wisps) {
    if (w.dead) continue;
    const color = w.frozen > 0 ? "140,230,255" : "177,151,252";
    glow(w.x, w.y, w.r * 2.4, color, 0.55);
    ctx.fillStyle = `rgb(${color})`;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;  // white arc = health left
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * w.hp / WISP_HP); ctx.stroke();
  }

  // Hand skeletons, tinted with the colour of the active spell
  for (const h of hands) {
    if (!h.pts) continue;
    ctx.strokeStyle = `rgba(${SPELLS[h.gesture]?.glow ?? "255,255,255"},.6)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const [a, b] of BONES) { ctx.moveTo(h.pts[a].x, h.pts[a].y); ctx.lineTo(h.pts[b].x, h.pts[b].y); }
    ctx.stroke();
  }

  // Everything that glows is drawn "lighter": overlapping light adds up.
  ctx.globalCompositeOperation = "lighter";
  for (const h of hands) {
    if (h.pts && h.charge > 0) glow(h.pos.x, h.pos.y, h.size * (0.35 + 0.75 * h.charge), "255,140,40", 0.9);
  }
  for (const f of fireballs) { glow(f.x, f.y, f.r * 2.4, "255,130,30", 1); glow(f.x, f.y, f.r, "255,240,180", 1); }
  for (const p of particles) {
    const left = p.life / p.maxLife;
    ctx.fillStyle = `rgba(${p.color},${left})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * left), 0, Math.PI * 2); ctx.fill();
  }
  ctx.lineCap = "round";
  for (const r of rings) {
    const t = r.age / 0.35;
    ctx.strokeStyle = `rgba(255,190,90,${1 - t})`; ctx.lineWidth = 6 * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r + (r.max - r.r) * t, 0, Math.PI * 2); ctx.stroke();
  }
  for (const g of gusts) {
    const fade = 1 - g.age / 0.55, aim = Math.atan2(g.dy, g.dx);
    for (let i = 0; i < 3; i++) {                      // three curved lines, one behind the other
      ctx.strokeStyle = `rgba(230,240,255,${fade * (0.8 - i * 0.25)})`; ctx.lineWidth = 4 - i;
      ctx.beginPath();
      ctx.arc(g.x - g.dx * g.size * (1 + i * 0.35), g.y - g.dy * g.size * (1 + i * 0.35), g.size, aim - 0.7, aim + 0.7);
      ctx.stroke();
    }
  }
  for (const b of bolts) { drawBolt(b.a, b.b, 2.5); glow(b.a.x, b.a.y, 22, "150,190,255", 0.9); }
  ctx.globalCompositeOperation = "source-over";
}

// The spell book at the bottom.
function buildPanel() {
  panel.innerHTML = Object.entries(SPELLS).map(([key, s]) =>
    `<div class="spell" id="spell-${key}" style="--glow:rgb(${s.glow})"><div class="icon">${s.icon}</div><b>${s.name}</b>${s.how}</div>`).join("");
}
function updatePanel() {
  for (const key of Object.keys(SPELLS)) {
    document.getElementById("spell-" + key).classList.toggle("active", hands.some(h => h.pts && h.gesture === key));
  }
  const active = hands.find(h => h.pts && SPELLS[h.gesture]);
  hintEl.textContent = active ? SPELLS[active.gesture].hint
    : hands.some(h => h.pts) ? "Try a fist, a pointing finger, two fingers, or an open hand." : "Show a hand to the camera.";
}

// ----------------------------- MAIN LOOP -------------------------------------
let frames = 0, fps = 0, fpsTimer = performance.now(), lastTime = performance.now();

function loop() {
  requestAnimationFrame(loop);
  if (!handLandmarker || video.readyState < 2) return;

  const now = performance.now();
  const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));   // seconds since the last frame
  lastTime = now;

  // Only ask the model when the camera has a new picture; the effects keep
  // moving every screen refresh so they stay smooth.
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    let result;
    try {
      result = handLandmarker.detectForVideo(video, now);
    } catch (e) {
      if (engine === "GPU" && cpuBackup) { useCpu(e.message); return; }
      throw e;
    }
    if (checkGpu(result, now)) return;

    const handDt = Math.min(0.2, Math.max(0.001, (now - lastHandTime) / 1000));
    lastHandTime = now;
    bolts = [];                                   // lightning is rebuilt from scratch for every camera picture
    for (let i = 0; i < MAX_HANDS; i++) {
      if (!result.landmarks[i]) { hands[i] = newHand(); continue; }     // hand left: forget it
      const curl = {};
      for (const name of Object.keys(FINGERS)) curl[name] = fingerCurl(result.worldLandmarks[i], name);
      updateHand(hands[i], result.landmarks[i].map(toScreen), classify(curl), handDt);
    }
    updatePanel();
    frames++;
  }

  updateWorld(dt);
  draw();

  if (now - fpsTimer > 500) {
    fps = Math.round(frames * 1000 / (now - fpsTimer));
    frames = 0; fpsTimer = now;
    const count = hands.filter(h => h.pts).length;
    statusEl.textContent = `${fps} FPS · ${count} hand${count === 1 ? "" : "s"} · ${engine}`;
    statusEl.style.color = "";
  }
}
let lastHandTime = performance.now();

// ----------------------------- BUTTONS ---------------------------------------
document.getElementById("startBtn").onclick = async () => {
  try {
    errorEl.textContent = "";
    statusEl.textContent = "Starting camera…";
    document.getElementById("startBtn").textContent = "Loading…";
    await startCamera();
    document.getElementById("start").style.display = "none";
    statusEl.textContent = "Loading hand model (a few MB, first time only)…";
    await loadModel();
    resize();
    navigator.wakeLock?.request("screen").catch(() => {});
    loop();
  } catch (e) {
    console.error(e);
    document.getElementById("start").style.display = "flex";
    document.getElementById("startBtn").textContent = "Start camera";
    errorEl.textContent = e.name === "NotAllowedError"
      ? "Camera permission was denied. Allow the camera for this site and try again."
      : "Could not start: " + (e.message || e.name);
  }
};

document.getElementById("flipBtn").onclick = async () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  try { await startCamera(); } catch (e) { statusEl.textContent = "Flip failed: " + e.message; }
};

window.addEventListener("resize", () => { if (handLandmarker) resize(); });

// Phones stop the camera when the browser goes to the background. Start it again on return.
document.addEventListener("visibilitychange", () => {
  const track = video.srcObject?.getVideoTracks()[0];
  if (!document.hidden && handLandmarker && (!track || track.readyState === "ended")) {
    startCamera().catch(e => showError(e.message));
  }
});

buildPanel();
</script>
</body>
